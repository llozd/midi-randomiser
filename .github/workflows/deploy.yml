name: deploy

on:
  push:
    branches: [main]
    # Neither is part of the site, and the sync workflow commits them after
    # deploying, so rebuilding for them would be a wasted round trip.
    paths-ignore:
      - package.json
      - CHANGELOG.md
  workflow_call:
    inputs:
      upstream:
        description: Dataset commit to build the devices from.
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than racing them, and never cancel one part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run devices
      - run: npm run lint
      - run: npm test

  deploy:
    # Nothing is published unless lint and the tests pass first.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5

      - name: Resolve the dataset commit to build
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          sha="$UPSTREAM"

          # A push deploys the dataset the last release was cut from, so an app
          # change can't quietly ship device changes nothing describes.
          if [ -z "$sha" ]; then
            sha=$(gh release view --json body --jq .body 2>/dev/null \
              | grep -oE 'pencilresearch/midi@[0-9a-f]{40}' \
              | cut -d@ -f2 || true)
          fi

          if [ -z "$sha" ]; then
            sha=$(gh api repos/pencilresearch/midi/commits/main --jq .sha)
            echo "No release to pin to, building from $sha."
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Generate the devices from the MIDI Guide dataset
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          npm ci
          git clone --quiet https://github.com/pencilresearch/midi.git .midi-guide
          git -C .midi-guide checkout --quiet "$SHA"
          node scripts/import-devices.mjs .midi-guide
          node scripts/validate-devices.mjs

      - name: Assemble the site
        # Only the files the app needs - no tooling, tests or docs.
        run: |
          mkdir -p _site/devices
          cp index.html _site/
          cp -r css js _site/
          cp -r devices/generated _site/devices/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
