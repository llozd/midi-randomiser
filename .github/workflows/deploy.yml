name: deploy

on:
  push:
    branches: [main]
    # Neither is part of the site, and the sync workflow commits them after
    # deploying, so rebuilding for them would be a wasted round trip.
    paths-ignore:
      - package.json
      - CHANGELOG.md
  workflow_call:
    inputs:
      upstream:
        description: Dataset commit to build the devices from.
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than racing them, and never cancel one part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run devices
      - run: npm run lint
      - run: npm test

  deploy:
    # Nothing is published unless lint and the tests pass first.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5

      - name: Resolve the dataset commit to build
        id: upstream
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          # A push builds whatever devices/SOURCE records, so an app change
          # can't quietly ship device changes that nothing describes.
          sha="${UPSTREAM:-$(cat devices/SOURCE)}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building devices from $sha."

      - name: Generate the devices from the MIDI Guide dataset
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          npm ci
          git clone --quiet https://github.com/pencilresearch/midi.git .midi-guide
          git -C .midi-guide checkout --quiet "$SHA"
          node scripts/import-devices.mjs .midi-guide
          node scripts/validate-devices.mjs

      - name: Assemble the site
        # Only the files the app needs - no tooling, tests or docs.
        run: |
          mkdir -p _site/devices
          cp index.html _site/
          cp -r css js _site/
          cp -r devices/generated _site/devices/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
