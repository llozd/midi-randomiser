name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than racing them, and never cancel one part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run devices
      - run: npm run lint
      - run: npm test

  deploy:
    # Nothing is published unless lint and the tests pass first.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Generate the devices from the MIDI Guide dataset
        run: |
          npm ci
          npm run devices
      - name: Assemble the site
        # Only the files the app needs - no tooling, tests or docs.
        run: |
          mkdir -p _site/devices
          cp index.html _site/
          cp -r css js _site/
          cp -r devices/generated _site/devices/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
