name: ci

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        # Devices are generated, so lint needs something to validate.
      - run: npm run devices
      - run: npm run lint
      - run: npm test
